name: Build and release

# GitHub's windows-latest runners ship Visual Studio 2022 Enterprise *including*
# the VSSDK build targets, so the .vsix is built by the real toolchain here even
# though no contributor needs VS 2022 installed locally.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/setup-msbuild@v2

      # ---------------------------------------------------- theme + verification
      - name: Build theme JSON
        run: node scripts/build-theme.js

      - name: Verify contrast rules
        run: node scripts/contrast-check.js

      - name: Regenerate icon and check it is committed
        shell: pwsh
        run: |
          node scripts/make-icon.js
          # The icon is generated from the palette; if it no longer matches what
          # is committed, the palette changed without the icon being refreshed.
          git diff --exit-code -- vsix/icon.png vscode/icon.png

      # ------------------------------------------------------------- pkgdef
      - name: Build ThemeConverter
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/theme-converter-for-vs.git .tools/theme-converter
          dotnet build .tools/theme-converter/ThemeConverter/ThemeConverter/ThemeConverter.csproj `
            -c Release -o .tools/converter-bin

      - name: Convert theme to .pkgdef
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          # ThemeConverter takes the display name from the input FILENAME, and
          # resolves its mapping files against the working directory.
          New-Item -ItemType Directory -Force -Path build, stage | Out-Null
          Copy-Item theme/VioletHour.json 'stage/Violet Hour.json'
          $stage = (Resolve-Path stage).Path
          Push-Location .tools/converter-bin
          dotnet ./ThemeConverter.dll -i "$stage/Violet Hour.json" -o $stage
          Pop-Location
          # Pin the theme GUID: the converter stamps a random one every run.
          node scripts/finalize-pkgdef.js "stage/Violet Hour.pkgdef" build/VioletHour.pkgdef
          Copy-Item build/VioletHour.pkgdef vsix/VioletHour.pkgdef -Force

      # --------------------------------------------------------------- vsix
      - name: Package VSIX (Visual Studio 2022)
        shell: pwsh
        run: msbuild vsix/VioletHour.csproj /t:Rebuild /p:Configuration=Release /v:minimal /restore

      - name: Package VSIX (VS Code)
        shell: pwsh
        run: |
          # Build only -- the install step in the script needs a local VS Code.
          $stage = Join-Path $env:RUNNER_TEMP 'vscode-ext'
          New-Item -ItemType Directory -Force -Path "$stage/extension/themes" | Out-Null
          Copy-Item vscode/package.json  "$stage/extension/package.json"
          Copy-Item vscode/icon.png      "$stage/extension/icon.png"
          Copy-Item LICENSE.txt          "$stage/extension/LICENSE.txt"
          Copy-Item README.md            "$stage/extension/README.md"
          Copy-Item theme/VioletHour.json "$stage/extension/themes/VioletHour.json"
          Copy-Item vscode/extension.vsixmanifest "$stage/extension.vsixmanifest"
          Copy-Item -LiteralPath 'vscode/[Content_Types].xml' -Destination "$stage/[Content_Types].xml"
          # Same packer as the local script, so CI and local output match and the
          # entry names are guaranteed to use forward slashes.
          ./scripts/make-vsix-zip.ps1 -Source $stage -Destination "$PWD/violet-hour-vscode-2.2.0.vsix"

      # Catches manifest regressions (bad publisher, missing icon, broken engines)
      # on every push, rather than at publish time when a tag is already cut.
      # Also produces the package to UPLOAD BY HAND at
      # marketplace.visualstudio.com/manage. It differs from the sideload .vsix:
      # vsce declares Content.Details / Changelog / License assets, which are what
      # make the listing page render a description at all. The hand-rolled package
      # installs fine but would publish as a blank listing.
      - name: Validate Marketplace package
        shell: bash
        run: |
          stage="$RUNNER_TEMP/vsce-validate"
          mkdir -p "$stage/themes"
          cp vscode/package.json vscode/icon.png "$stage/"
          cp LICENSE.txt README.md CHANGELOG.md "$stage/"
          cp theme/VioletHour.json "$stage/themes/"
          cd "$stage"
          # vsce silently globs zero files under long paths, so assert it saw them.
          n=$(npx --yes @vscode/vsce@latest ls | wc -l)
          echo "vsce sees $n files"
          if [ "$n" -lt 5 ]; then echo "::error::vsce found $n files - expected at least 5"; exit 1; fi
          npx --yes @vscode/vsce@latest package --out "$RUNNER_TEMP/VioletHour-Marketplace.vsix"

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Get-ChildItem vsix/bin/Release -Filter *.vsix -Recurse |
            Copy-Item -Destination dist/VioletHour.vsix
          Copy-Item violet-hour-vscode-2.2.0.vsix dist/VioletHour-VSCode.vsix
          Copy-Item build/VioletHour.pkgdef       dist/VioletHour.pkgdef
          Copy-Item "$env:RUNNER_TEMP/VioletHour-Marketplace.vsix" dist/VioletHour-Marketplace.vsix
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: violet-hour
          path: dist/*

      # ------------------------------------------------------------ release
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VioletHour.vsix
            dist/VioletHour-VSCode.vsix
            dist/VioletHour-Marketplace.vsix
            dist/VioletHour.pkgdef
          generate_release_notes: true
          body: |
            ## Install

            **Visual Studio 2022** — download `VioletHour.vsix`, double-click it,
            restart VS, then **Tools → Theme → Violet Hour**.

            **VS Code** — download `VioletHour-VSCode.vsix`, then
            `code --install-extension VioletHour-VSCode.vsix`
            (or Extensions pane → `...` → *Install from VSIX*).

            `VioletHour-Marketplace.vsix` is the same theme packaged by `vsce`
            for uploading to the Marketplace by hand — it carries the readme,
            changelog and licence assets the listing page needs.

            Every color is solved against a contrast budget, not picked by eye.
            Contrast report: 113/113 assertions pass. Original palette, MIT licensed.

  # ---------------------------------------------------------------------------
  # Publishing to the VS Code Marketplace is what makes the theme findable in
  # the Extensions pane's SEARCH. It is opt-in: the job is skipped entirely
  # unless a VSCE_PAT secret exists, so forks and PRs never attempt it.
  #
  # To enable: create a publisher at https://marketplace.visualstudio.com/manage,
  # mint an Azure DevOps PAT scoped to Marketplace > Manage, then add it as the
  # repository secret VSCE_PAT. Never paste that token anywhere else.
  publish-marketplace:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for a publish token
        id: gate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VSCE_PAT is not set - skipping Marketplace publish. The GitHub release still has the .vsix."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build theme
        if: steps.gate.outputs.enabled == 'true'
        run: node scripts/build-theme.js && node scripts/contrast-check.js

      - name: Stage and publish
        if: steps.gate.outputs.enabled == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          publisher=$(node -p "require('./vscode/package.json').publisher")
          if [ "$publisher" = "local" ]; then
            echo "::error::vscode/package.json still has publisher \"local\". Set it to your Marketplace publisher ID before publishing."
            exit 1
          fi
          echo "publishing as: $publisher"

          # vsce packages the working directory, so stage a clean extension root.
          # (It also needs a short, plain path - long paths break its globbing.)
          stage="$RUNNER_TEMP/ext"
          mkdir -p "$stage/themes"
          cp vscode/package.json vscode/icon.png "$stage/"
          cp LICENSE.txt README.md CHANGELOG.md "$stage/"
          cp theme/VioletHour.json "$stage/themes/"
          cd "$stage"
          npx --yes @vscode/vsce@latest publish --no-dependencies
